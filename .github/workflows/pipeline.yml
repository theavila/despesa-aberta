name: Pipeline diário

# Coleta → analisa → exporta → commit dos JSONs → build e deploy do site.
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em America/Sao_Paulo (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "config.toml"
      - "respostas/**"
      - "site/**"
      - "!site/src/data/**"

# Um único job por vez mexe no estado (compartilhado com publicar.yml).
concurrency:
  group: serenata-estado
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Configura o autor dos commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restaura o estado (branch data)
        run: |
          bash .github/scripts/estado.sh baixar
          uv run serenata estado restaurar
      - run: uv run serenata coletar
      - run: uv run serenata analisar
      - run: uv run serenata exportar
      - name: Salva o estado (branch data)
        run: |
          uv run serenata estado salvar
          bash .github/scripts/estado.sh enviar "chore(dados): estado após o pipeline de $(date -u +%F)"
      - name: Commit dos JSONs do site
        run: |
          git add site/src/data
          if git diff --cached --quiet; then
            echo "JSONs sem mudanças."
          else
            git commit -m "chore(dados): atualiza dados do site ($(date -u +%F))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  site:
    needs: dados
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # inclui o commit de dados feito pelo job anterior
      - uses: actions/configure-pages@v6
        id: pages
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - uses: actions/deploy-pages@v5
        id: deploy
