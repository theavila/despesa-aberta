name: Publicar alertas

# A cada 3 horas em horário comercial (09h, 12h, 15h e 18h de Brasília, dias úteis).
# Agendado: só publica de verdade se a variável de repositório PUBLICAR for "1";
# caso contrário roda em dry-run e só mostra os posts no log.
# Manual: publica de verdade quando "dry_run" é desmarcado (útil para testar uma rede
# com --limite 1 sem ligar a publicação automática).
on:
  schedule:
    - cron: "0 12,15,18,21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (desmarque para publicar de verdade)"
        type: boolean
        default: true
      rede:
        description: "Rede"
        type: choice
        options: [todas, x, bluesky, mastodon]
        default: todas
      limite:
        description: "Máximo de posts por rede (vazio = padrão do config.toml)"
        type: string
        default: ""

concurrency:
  group: despesa-aberta-estado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLICAR: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && '1' || vars.PUBLICAR || '0' }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_API_BASE_URL: ${{ vars.MASTODON_API_BASE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Configura o autor dos commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restaura despesas e estado
        run: |
          bash .github/scripts/estado.sh baixar
          uv run despesa-aberta coletar
          uv run despesa-aberta estado restaurar
      - name: Publica
        env:
          ENTRADA_DRY_RUN: ${{ inputs.dry_run }}
          ENTRADA_REDE: ${{ inputs.rede }}
          ENTRADA_LIMITE: ${{ inputs.limite }}
        run: |
          args=()
          [ "$ENTRADA_DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$ENTRADA_REDE" ] && [ "$ENTRADA_REDE" != "todas" ] && args+=(--rede "$ENTRADA_REDE")
          if [ -n "$ENTRADA_LIMITE" ]; then
            [[ "$ENTRADA_LIMITE" =~ ^[0-9]+$ ]] || { echo "limite inválido: $ENTRADA_LIMITE"; exit 1; }
            args+=(--limite "$ENTRADA_LIMITE")
          fi
          uv run despesa-aberta publicar "${args[@]}"
      - name: Salva o log de publicações (branch data)
        run: |
          uv run despesa-aberta estado salvar
          bash .github/scripts/estado.sh enviar "chore(dados): log de publicações de $(date -u +'%F %H:%M')"
