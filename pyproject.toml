[project]
name = "despesa-aberta"
version = "0.1.0"
description = "Transparência automatizada dos gastos de parlamentares federais"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "atproto>=0.0.73",
    "duckdb>=1.1",
    "httpx>=0.27",
    "mastodon-py>=2.3.3",
    "polars>=2.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.8",
    "tzdata>=2026.5",
]

[project.scripts]
despesa-aberta = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
